name: Pages Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    environment:
      name: pages-preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 文章 PR 快路径校验
        if: ${{ startsWith(github.head_ref, 'admin/article/') }}
        shell: bash
        run: |
          diff_file=$(mktemp)
          git diff --name-only HEAD^1 HEAD^2 > "$diff_file"
          test "$(wc -l < "$diff_file" | tr -d ' ')" = 1
          path=$(sed -n '1p' "$diff_file")
          [[ "$path" =~ ^content/posts/[0-9]{4}/[a-z0-9]+(-[a-z0-9]+)*\.md$ ]]
          pnpm exec eslint "$path"
          export NUXT_ARTICLE_PREVIEW=1
          pnpm generate
          pnpm check:smoke
          pnpm check:links
          pnpm check:secrets
      - run: pnpm verify
        if: ${{ !startsWith(github.head_ref, 'admin/article/') }}
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=fly-living --branch=pr-${{ github.event.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
