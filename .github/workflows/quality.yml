name: Quality

on:
  pull_request:
  push:
    branches: ['**']
    paths-ignore:
      - 'backups/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  article-fast-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.detect.outputs.eligible || 'false' }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'admin/article/') }}
        with:
          fetch-depth: 2
      - name: 检测文章 PR 快路径
        id: detect
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'admin/article/') }}
        shell: bash
        run: |
          diff_file=$(mktemp)
          git diff --name-only HEAD^1 HEAD^2 > "$diff_file"
          changed_count=$(wc -l < "$diff_file" | tr -d ' ')
          changed_path=$(sed -n '1p' "$diff_file")
          if [[ "$changed_count" = 1 ]] && bash scripts/is-article-fast-path.sh "$changed_path" > /dev/null; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "文章快路径不适用，改走完整校验。"
            sed 's/^/ - /' "$diff_file"
          fi

  verify:
    needs: article-fast-path
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
          cache: true
      - uses: actions/setup-node@v6
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm lint
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm typecheck
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm test:unit
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm test:workers
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm generate
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm check:smoke
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm check:links
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm check:secrets
        if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}

  mobile-quality:
    needs: article-fast-path
    if: ${{ needs.article-fast-path.outputs.eligible != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_REUSE_OUTPUT: '1'
      E2E_SERVER_COMMAND: pnpm preview:e2e:static
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Confirm Linux visual environment
        run: test "$RUNNER_OS" = "Linux"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate
      - run: pnpm check:mobile-performance
      - run: pnpm test:e2e:mobile
      - run: pnpm test:e2e:mobile:visual
      - name: Upload mobile quality diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-quality-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
