name: Quality

on:
  pull_request:
  push:
    branches: ['**']
    paths-ignore:
      - 'backups/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: 检测文章 PR 快路径
        id: article-fast-path
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'admin/article/') }}
        shell: bash
        run: |
          diff_file=$(mktemp)
          git diff --name-only HEAD^1 HEAD^2 > "$diff_file"
          changed_count=$(wc -l < "$diff_file" | tr -d ' ')
          changed_path=$(sed -n '1p' "$diff_file")
          if [[ "$changed_count" = 1 ]] && article_path=$(bash scripts/is-article-fast-path.sh "$changed_path"); then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "ARTICLE_PATH=$article_path" >> "$GITHUB_ENV"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "文章快路径不适用，改走完整校验。"
            sed 's/^/ - /' "$diff_file"
          fi
      - uses: pnpm/action-setup@v6
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm lint
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm typecheck
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm test:unit
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm test:workers
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm generate
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm check:smoke
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm check:links
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
      - run: pnpm check:secrets
        if: ${{ steps.article-fast-path.outputs.eligible != 'true' }}
