name: Workers Production

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'shared/**'
      - .github/workflows/workers-production.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: workers-production
  cancel-in-progress: false

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://flyovo.cc.cd/api/health
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:workers
      - name: Apply D1 migrations
        run: pnpm --filter @fly-living/api-worker exec wrangler d1 migrations apply DB --remote
      - name: Deploy API Worker
        run: pnpm --filter @fly-living/api-worker exec wrangler deploy
      - name: Check API Worker through a remote preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @fly-living/api-worker exec wrangler dev --remote --port 8788 > /tmp/fly-living-api-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8788/api/health > /tmp/fly-living-api-health.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fly-living-api-preview.log
          exit 1
      - name: Deploy edge Worker
        run: pnpm --filter @fly-living/edge-worker exec wrangler deploy
      - name: Verify same-origin health
        run: curl --fail --retry 8 --retry-delay 3 --retry-all-errors https://flyovo.cc.cd/api/health
