name: Workers Production

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'shared/**'
      - config/site/modules.json
      - config/site/weather.json
      - config/news/sources.json
      - content/playlists/default.json
      - .github/workflows/workers-production.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: workers-production
  cancel-in-progress: false

jobs:
  deploy-workers:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment:
      name: production
      url: https://flyovo.cc.cd/api/health
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:workers
      - name: Apply D1 migrations
        run: pnpm --filter @fly-living/api-worker exec wrangler d1 migrations apply DB --remote
      - name: Deploy API Worker
        run: pnpm --filter @fly-living/api-worker exec wrangler deploy
      - name: Deploy edge Worker
        run: pnpm --filter @fly-living/edge-worker exec wrangler deploy
      - name: Verify same-origin health
        run: curl --fail --retry 8 --retry-delay 3 --retry-all-errors https://flyovo.cc.cd/api/health
