name: Pages Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backups/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    environment:
      name: production
      url: https://flyovo.cc.cd/
    env:
      NUXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Ensure Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/fly-living" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}')"
          printf '%s' "$response" | jq -e '.success == true and .result.production_branch == "main"' > /dev/null
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=fly-living --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
      - name: Verify controlled production entries
        timeout-minutes: 8
        env:
          EXPECTED_PAGES_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_PROBE_ATTEMPTS: '20'
          PRODUCTION_PROBE_DELAY_MS: '5000'
        run: |
          test -n "$EXPECTED_PAGES_DEPLOYMENT_URL"
          pnpm check:production
