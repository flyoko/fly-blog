name: Pages Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backups/**'
      - 'workers/**'
      - 'test/**'
      - 'e2e/**'
      - 'docs/**'
      - '.vscode/**'
      - README.md
      - AGENTS.md
      - .github/workflows/quality.yml
      - .github/workflows/pages-preview.yml
      - .github/workflows/workers-production.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  source_quality:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pages-source

  build_pages:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pages
      - name: Upload Pages production artifact
        uses: actions/upload-artifact@v6
        with:
          name: pages-production-${{ github.sha }}
          path: .output/public
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 1

  deploy_production:
    needs: [source_quality, build_pages]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: production
      url: https://flyovo.cc.cd/
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/setup-pnpm
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Download Pages production artifact
        uses: actions/download-artifact@v7
        with:
          name: pages-production-${{ github.sha }}
          path: .output/public
      - name: Verify downloaded artifact
        run: test -f .output/public/index.html
      - name: Ensure Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/fly-living" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}')"
          printf '%s' "$response" | jq -e '.success == true and .result.production_branch == "main"' > /dev/null
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=fly-living --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
      - name: Verify controlled production entries
        timeout-minutes: 8
        env:
          EXPECTED_PAGES_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_PROBE_ATTEMPTS: '20'
          PRODUCTION_PROBE_DELAY_MS: '5000'
        run: |
          test -n "$EXPECTED_PAGES_DEPLOYMENT_URL"
          pnpm check:production
